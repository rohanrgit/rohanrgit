name: Streak card

on:
  schedule:
    - cron: "30 0 * * *"   # daily at 00:30 UTC (06:00 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streak-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate streak card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_streak.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-light.svg assets/streak-dark.svg
          if git diff --staged --quiet; then
            echo "No change to the streak card."
          else
            git commit -m "chore: refresh streak card [skip ci]"
            git push
          fi
