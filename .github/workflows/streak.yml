name: Profile cards

on:
  schedule:
    - cron: "30 0 * * *"   # daily at 00:30 UTC (06:00 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate streak card
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_streak.py

      - name: Generate languages card
        if: env.HAS_PAT == 'true'   # needs a PAT that can read private repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/generate_languages.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-light.svg assets/streak-dark.svg assets/langs-light.svg assets/langs-dark.svg
          if git diff --staged --quiet; then
            echo "No card changes."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
